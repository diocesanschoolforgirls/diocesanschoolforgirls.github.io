name: Rebuild index of published pages

on:
  schedule:
    - cron: "17 * * * *"   # hourly
  workflow_dispatch:         # "Run workflow" button on the Actions tab
  push:
    branches: [main]
    paths:
      - index.template.html
      - labels.json
      - school-resources.json
      - .github/scripts/build_index.py
      - .github/workflows/build-index.yml

permissions:
  contents: write

concurrency:
  group: build-index
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Generate index.html
        env:
          ORG: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/build_index.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Update list of published pages"
          git push
